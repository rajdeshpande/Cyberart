<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>शुभ दिवाळी — Rajkumar Deshpande</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080214;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #app-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            border: 4px solid #ffb703;
            box-shadow: inset 0 0 20px #ff0055, 0 0 15px #ffe600;
        }

        /* LED String Light Borders */
        .led-border {
            position: absolute;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }
        .led-top { top: 0; left: 0; right: 0; height: 10px; flex-direction: row; }
        .led-bottom { bottom: 0; left: 0; right: 0; height: 10px; flex-direction: row; }
        .led-left { top: 0; bottom: 0; left: 0; width: 10px; flex-direction: column; }
        .led-right { top: 0; bottom: 0; right: 0; width: 10px; flex-direction: column; }

        .led-bulb {
            width: 8px; height: 8px;
            border-radius: 50%;
            animation: ledBlink 1.2s infinite alternate;
        }
        @keyframes ledBlink {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        header {
            background: linear-gradient(180deg, rgba(35, 5, 50, 0.95) 0%, rgba(15, 2, 25, 0.95) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 6px 8px 6px;
            border-bottom: 2px solid #ffe600;
            z-index: 10;
            flex-shrink: 0;
        }
        .diwali-title {
            font-size: 1.1rem;
            font-weight: 900;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 5px #fff, 0 0 10px #ffe600, 0 0 20px #ff5e00, 0 0 30px #ff0055;
            animation: neonPulse 1.5s infinite alternate;
        }
        @keyframes neonPulse {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px #ffe600, 0 0 20px #ff5e00, 0 0 30px #ff0055; }
            100% { text-shadow: 0 0 10px #fff, 0 0 20px #00f2fe, 0 0 30px #39ff14, 0 0 40px #ff0055; }
        }
        .marathi-sub {
            font-size: 0.78rem;
            color: #ffe600;
            font-weight: 700;
            margin-top: 2px;
            text-shadow: 0 0 6px rgba(255, 230, 0, 0.8);
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 6px;
            background: rgba(15, 2, 25, 0.9);
            border-bottom: 1px solid rgba(255, 230, 0, 0.3);
            z-index: 10;
            flex-shrink: 0;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid #ffe600;
            color: #fff;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 230, 0, 0.4);
        }
        .btn.active {
            background: linear-gradient(135deg, #ff5e00 0%, #ff0055 100%);
            border-color: #ffe600;
            box-shadow: 0 0 10px #ff0055;
        }

        #canvas-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            background: radial-gradient(circle at center, #260540 0%, #080214 100%);
            touch-action: none;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
            touch-action: none;
        }
        #bg-canvas { z-index: 1; pointer-events: none; }
        #paintCanvas { z-index: 2; }
        #fx-canvas { z-index: 3; pointer-events: none; }

        /* Interactive Intro Prompt */
        #intro-overlay {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            pointer-events: none;
            color: #00f2fe;
            font-size: 0.9rem;
            font-weight: 800;
            text-align: center;
            padding: 10px 18px;
            border-radius: 20px;
            background: rgba(10, 2, 25, 0.85);
            border: 1.5px solid #00f2fe;
            box-shadow: 0 0 15px #00f2fe;
            animation: introGlow 1.5s infinite alternate;
            transition: opacity 0.5s ease;
        }
        @keyframes introGlow {
            0% { transform: translate(-50%, -50%) scale(0.98); box-shadow: 0 0 10px #00f2fe; }
            100% { transform: translate(-50%, -50%) scale(1.04); box-shadow: 0 0 22px #00f2fe, 0 0 35px #ff0055; }
        }

        .cracker-bar {
            background: linear-gradient(0deg, rgba(25, 3, 40, 0.95) 0%, rgba(10, 2, 20, 0.95) 100%);
            display: flex;
            justify-content: space-around;
            padding: 8px 4px 10px 4px;
            border-top: 2px solid #ffe600;
            z-index: 10;
            flex-shrink: 0;
        }
        .cracker-btn {
            background: linear-gradient(135deg, #4a0b75 0%, #1e0333 100%);
            border: 1.5px solid #ffb703;
            color: #ffe600;
            padding: 7px 2px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
            margin: 0 2px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 183, 3, 0.3);
        }
        .cracker-btn:active {
            transform: scale(0.92);
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 14px #ff0055;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- LED String Light Borders -->
        <div class="led-border led-top" id="led-top"></div>
        <div class="led-border led-bottom" id="led-bottom"></div>
        <div class="led-border led-left" id="led-left"></div>
        <div class="led-border led-right" id="led-right"></div>

        <header>
            <div class="diwali-title">✨ Happy Diwali from Rajkumar Deshpande ✨</div>
            <div class="marathi-sub">शुभ दीपावली! सुंदर रांगोळी काढा व फटाके उडवा</div>
        </header>

        <div class="toolbar">
            <button class="btn active" id="btn-sound">🪔 संगीत: सुरु</button>
            <button class="btn" id="btn-clear">🧹 साफ करा</button>
            <button class="btn" id="btn-symm">12 अक्ष (Axes)</button>
            <button class="btn" id="btn-color">रंग: रंगबिरंगी (Neon)</button>
        </div>

        <div id="canvas-wrapper">
            <div id="intro-overlay">स्क्रीनवरून बोट फिरवा आणि रांगोळी काढा! 🪔✨</div>
            <canvas id="bg-canvas"></canvas>
            <canvas id="paintCanvas"></canvas>
            <canvas id="fx-canvas"></canvas>
        </div>

        <div class="cracker-bar">
            <button class="cracker-btn" onclick="triggerCracker('sparkler')">✨<span>फुलबाजा</span></button>
            <button class="cracker-btn" onclick="triggerCracker('chakra')">🌀<span>भुईचक्र</span></button>
            <button class="cracker-btn" onclick="triggerCracker('anar')">🎆<span>अनार</span></button>
            <button class="cracker-btn" onclick="triggerCracker('rocket')">🚀<span>रॉकेट</span></button>
        </div>
    </div>

    <script>
        // Generate LED Bulbs
        const ledColors = ['#ff0055', '#ffe600', '#00f2fe', '#39ff14', '#ff5e00', '#e0aaff'];
        function buildLEDs(containerId, count) {
            const el = document.getElementById(containerId);
            if (!el) return;
            el.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const bulb = document.createElement('div');
                bulb.className = 'led-bulb';
                const c = ledColors[i % ledColors.length];
                bulb.style.backgroundColor = c;
                bulb.style.boxShadow = `0 0 8px ${c}, 0 0 12px ${c}`;
                bulb.style.animationDelay = `${(i * 0.15) % 1.2}s`;
                el.appendChild(bulb);
            }
        }
        buildLEDs('led-top', 16);
        buildLEDs('led-bottom', 16);
        buildLEDs('led-left', 12);
        buildLEDs('led-right', 12);

        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const fxCanvas = document.getElementById('fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        const introOverlay = document.getElementById('intro-overlay');

        let isDrawing = false;
        let firstTouch = false;
        let lastX = 0, lastY = 0;
        let axesList = [8, 12, 16, 24, 6];
        let axesIdx = 1;
        let axes = axesList[axesIdx];
        
        let colorModes = ['vivid', 'gold', 'flame', 'magenta'];
        let colorIdx = 0;
        let hue = 180;

        let audioEnabled = true;
        let audioCtx = null;
        let ambientTimer = null;

        // Vivid Rangoli Palette (Excluding plain white/dull red)
        const vividPalette = ['#00f2fe', '#ffe600', '#39ff14', '#ff007f', '#ff5e00', '#00ffcc', '#bf00ff'];

        // Stars setup
        let stars = [];
        function initStars() {
            stars = [];
            const w = bgCanvas.width || window.innerWidth;
            const h = bgCanvas.height || window.innerHeight;
            for(let i = 0; i < 90; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 2.5 + 1,
                    color: vividPalette[Math.floor(Math.random() * vividPalette.length)],
                    alpha: Math.random(),
                    speed: Math.random() * 0.04 + 0.01
                });
            }
        }

        // Render Akash Kandil
        function drawKandil(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            ctx.strokeStyle = '#ffe600';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(0, -30); ctx.stroke();

            ctx.fillStyle = '#ff0055';
            ctx.strokeStyle = '#ffe600';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, -30); ctx.lineTo(25, 0); ctx.lineTo(0, 30); ctx.lineTo(-25, 0);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#ffe600';
            ctx.beginPath();
            ctx.moveTo(0, -15); ctx.lineTo(12, 0); ctx.lineTo(0, 15); ctx.lineTo(-12, 0);
            ctx.closePath(); ctx.fill();

            const colors = ['#ff5e00', '#ffe600', '#00f2fe'];
            for(let i = -2; i <= 2; i++) {
                ctx.strokeStyle = colors[Math.abs(i) % colors.length];
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(i * 10, 30); ctx.lineTo(i * 12, 70);
                ctx.stroke();
            }
            ctx.restore();
        }

        // Render Diya with flickering flame
        function drawDiya(ctx, x, y, scale, glowPulse) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Terracotta Bowl
            ctx.fillStyle = '#d4af37';
            ctx.strokeStyle = '#ff5e00';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI, false); ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Flame Glow
            ctx.shadowBlur = 15 + glowPulse * 10;
            ctx.shadowColor = '#ff5e00';

            // Outer Flame
            ctx.fillStyle = '#ff5e00';
            ctx.beginPath();
            ctx.moveTo(-10, -5); 
            ctx.quadraticCurveTo(0, -35 - glowPulse * 5, 0, -45 - glowPulse * 8); 
            ctx.quadraticCurveTo(0, -35 - glowPulse * 5, 10, -5);
            ctx.closePath(); ctx.fill();

            // Inner Flame
            ctx.fillStyle = '#ffe600';
            ctx.beginPath();
            ctx.moveTo(-5, -5); 
            ctx.quadraticCurveTo(0, -25, 0, -32 - glowPulse * 4); 
            ctx.quadraticCurveTo(0, -25, 5, -5);
            ctx.closePath(); ctx.fill();

            ctx.restore();
        }

        let pulseTime = 0;
        function drawBackground() {
            const w = bgCanvas.width;
            const h = bgCanvas.height;
            bgCtx.clearRect(0, 0, w, h);

            pulseTime += 0.05;
            const glowPulse = Math.sin(pulseTime) * 0.5 + 0.5;

            // Twinkling Stars
            for(let s of stars) {
                s.alpha += s.speed;
                if(s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                bgCtx.fillStyle = s.color;
                bgCtx.globalAlpha = Math.abs(s.alpha);
                bgCtx.shadowBlur = 6;
                bgCtx.shadowColor = s.color;
                bgCtx.beginPath();
                bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                bgCtx.fill();
            }
            bgCtx.globalAlpha = 1.0;
            bgCtx.shadowBlur = 0;

            // Corner Kandils
            drawKandil(bgCtx, 45, 50, 0.7);
            drawKandil(bgCtx, w - 45, 50, 0.7);

            // 3 Bottom Diyas (Middle one is larger with pulsing glow)
            drawDiya(bgCtx, w * 0.22, h - 32, 0.65, glowPulse * 0.4);
            drawDiya(bgCtx, w * 0.50, h - 38, 0.95, glowPulse);
            drawDiya(bgCtx, w * 0.78, h - 32, 0.65, glowPulse * 0.4);

            requestAnimationFrame(drawBackground);
        }

        // Web Audio Synthesizer: Shehnai Raga Melodies & Bell Chimes
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTempleBell(freq) {
            if (!audioEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            } catch(e) {}
        }

        function startPleasantAmbient() {
            if (ambientTimer) return;
            const ragaNotes = [293.66, 329.63, 392.00, 440.00, 493.88, 587.33, 659.25]; // Raga Yaman scale
            ambientTimer = setInterval(() => {
                if (!audioEnabled) return;
                initAudio();
                const note = ragaNotes[Math.floor(Math.random() * ragaNotes.length)];
                playTempleBell(note);
            }, 1800);
        }

        function playTone(freq, type='sine', duration=0.3, vol=0.2) {
            if (!audioEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playSparkleSound(y) {
            const scale = [293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
            const noteIdx = Math.floor(((bgCanvas.height - y) / bgCanvas.height) * scale.length);
            const freq = scale[Math.min(Math.max(noteIdx, 0), scale.length - 1)];
            playTone(freq, 'sine', 0.2, 0.12);
        }

        // Cracker Props & Particle Engine
        let fxParticles = [];
        let activeProps = [];

        function animateFX() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

            // Render Props (Anar Cone, Bhui Chakra wheel, Rocket Launch)
            for (let pr = activeProps.length - 1; pr >= 0; pr--) {
                let prop = activeProps[pr];
                prop.life -= 0.016;

                if (prop.type === 'anar') {
                    // Draw Anar Cone
                    fxCtx.save();
                    fxCtx.fillStyle = '#ff5e00';
                    fxCtx.strokeStyle = '#ffe600';
                    fxCtx.lineWidth = 2;
                    fxCtx.beginPath();
                    fxCtx.moveTo(prop.x - 20, prop.y);
                    fxCtx.lineTo(prop.x + 20, prop.y);
                    fxCtx.lineTo(prop.x, prop.y - 45);
                    fxCtx.closePath();
                    fxCtx.fill(); fxCtx.stroke();
                    fxCtx.restore();

                    // Continuous Fountain Emission
                    for(let i = 0; i < 8; i++) {
                        let angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.7;
                        let speed = Math.random() * 12 + 4;
                        fxParticles.push({
                            x: prop.x, y: prop.y - 45,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            size: Math.random() * 3.5 + 1.5,
                            color: Math.random() > 0.3 ? '#ffe600' : '#ff5e00',
                            alpha: 1, decay: 0.015, gravity: 0.2, bounce: true
                        });
                    }

                } else if (prop.type === 'chakra') {
                    // Draw Spinning Bhui Chakra Wheel
                    prop.angle += 0.3;
                    fxCtx.save();
                    fxCtx.translate(prop.x, prop.y);
                    fxCtx.rotate(prop.angle);
                    fxCtx.fillStyle = '#00f2fe';
                    fxCtx.strokeStyle = '#ffe600';
                    fxCtx.lineWidth = 3;
                    fxCtx.beginPath(); fxCtx.arc(0, 0, 22, 0, Math.PI * 2); fxCtx.fill(); ctx.stroke();
                    ctx.restore();

                    // Emit Centrifugal Sparks
                    for(let i = 0; i < 6; i++) {
                        let a = prop.angle + (i * Math.PI / 3);
                        let speed = Math.random() * 6 + 3;
                        fxParticles.push({
                            x: prop.x, y: prop.y,
                            vx: Math.cos(a) * speed,
                            vy: Math.sin(a) * speed,
                            size: Math.random() * 3 + 2,
                            color: vividPalette[Math.floor(Math.random() * vividPalette.length)],
                            alpha: 1, decay: 0.02, gravity: 0
                        });
                    }

                } else if (prop.type === 'rocket') {
                    prop.y += prop.vy;

                    // Rocket Smoke & Flame Trail
                    fxParticles.push({
                        x: prop.x + (Math.random() - 0.5) * 4,
                        y: prop.y + 15,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: Math.random() * 3 + 2,
                        size: Math.random() * 4 + 2,
                        color: '#ff5e00',
                        alpha: 1, decay: 0.05, gravity: 0.05
                    });

                    // Draw Rocket Body
                    fxCtx.fillStyle = '#ff0055';
                    fxCtx.shadowBlur = 10;
                    fxCtx.shadowColor = '#ffe600';
                    fxCtx.beginPath();
                    fxCtx.arc(prop.x, prop.y, 6, 0, Math.PI * 2);
                    fxCtx.fill();

                    // Explosive Burst at Apex
                    if (prop.y <= prop.targetY) {
                        for(let i = 0; i < 180; i++) {
                            let a = Math.random() * Math.PI * 2;
                            let speed = Math.random() * 11 + 2;
                            fxParticles.push({
                                x: prop.x, y: prop.y,
                                vx: Math.cos(a) * speed,
                                vy: Math.sin(a) * speed,
                                size: Math.random() * 4 + 2,
                                color: vividPalette[Math.floor(Math.random() * vividPalette.length)],
                                alpha: 1, decay: 0.012, gravity: 0.08
                            });
                        }
                        playTone(90, 'sawtooth', 0.8, 0.4);
                        activeProps.splice(pr, 1);
                        continue;
                    }
                }

                if (prop.life <= 0) activeProps.splice(pr, 1);
            }

            // Process Sparks/Particles
            const groundY = fxCanvas.height - 20;
            for(let i = fxParticles.length - 1; i >= 0; i--) {
                let p = fxParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity || 0.05;
                p.alpha -= p.decay;

                // Ground Bounce Physics for Anar sparks
                if (p.bounce && p.y >= groundY) {
                    p.y = groundY;
                    p.vy = -p.vy * 0.4;
                    p.vx *= 0.7;
                }

                if(p.alpha <= 0) {
                    fxParticles.splice(i, 1);
                    continue;
                }
                fxCtx.fillStyle = p.color;
                fxCtx.globalAlpha = p.alpha;
                fxCtx.shadowBlur = 8;
                fxCtx.shadowColor = p.color;
                fxCtx.beginPath();
                fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                fxCtx.fill();
            }
            fxCtx.globalAlpha = 1.0;
            fxCtx.shadowBlur = 0;
            requestAnimationFrame(animateFX);
        }

        function triggerCracker(type) {
            initAudio();
            startPleasantAmbient();
            const cx = fxCanvas.width / 2;
            const cy = fxCanvas.height / 2;

            if (type === 'sparkler') {
                for(let i = 0; i < 100; i++) {
                    let angle = Math.random() * Math.PI * 2;
                    let speed = Math.random() * 7 + 1;
                    fxParticles.push({
                        x: cx, y: cy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 3.5 + 1.5,
                        color: vividPalette[Math.floor(Math.random() * vividPalette.length)],
                        alpha: 1, decay: 0.015, gravity: 0.04
                    });
                }
                for(let t=0; t<10; t++) setTimeout(() => playTone(600 + Math.random()*800, 'sine', 0.1, 0.2), t*50);

            } else if (type === 'chakra') {
                activeProps.push({
                    type: 'chakra',
                    x: cx, y: cy,
                    angle: 0,
                    life: 2.5
                });
                for(let t=0; t<12; t++) setTimeout(() => playTone(250 + t*80, 'sine', 0.15, 0.2), t*40);

            } else if (type === 'anar') {
                activeProps.push({
                    type: 'anar',
                    x: cx, y: fxCanvas.height - 35,
                    life: 3.0
                });
                for(let t=0; t<14; t++) setTimeout(() => playTone(350 + Math.random()*500, 'triangle', 0.12, 0.18), t*60);

            } else if (type === 'rocket') {
                const rx = Math.random() * (fxCanvas.width * 0.6) + (fxCanvas.width * 0.2);
                activeProps.push({
                    type: 'rocket',
                    x: rx, y: fxCanvas.height - 10,
                    vy: -11,
                    targetY: fxCanvas.height * 0.25 + Math.random() * 60,
                    life: 2.0
                });
                for(let t=0; t<10; t++) setTimeout(() => playTone(350 + t*70, 'triangle', 0.1, 0.2), t*40);
            }
        }

        function resize() {
            const width = wrapper.clientWidth || window.innerWidth;
            const height = wrapper.clientHeight || (window.innerHeight - 150);
            canvas.width = width;
            canvas.height = height;
            bgCanvas.width = width;
            bgCanvas.height = height;
            fxCanvas.width = width;
            fxCanvas.height = height;
            initStars();
        }

        window.addEventListener('resize', resize);
        setTimeout(resize, 50);

        function getColor() {
            const mode = colorModes[colorIdx];
            if (mode === 'gold') return `hsl(45, 100%, ${50 + Math.random() * 20}%)`;
            if (mode === 'flame') return `hsl(${15 + Math.random() * 25}, 100%, 50%)`;
            if (mode === 'magenta') return `hsl(300, 100%, 60%)`;
            return vividPalette[Math.floor(Math.random() * vividPalette.length)];
        }

        function drawSymmetry(x1, y1, x2, y2) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const angleStep = (Math.PI * 2) / axes;

            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = getColor();
            ctx.shadowBlur = 12;
            ctx.shadowColor = ctx.strokeStyle;

            for (let i = 0; i < axes; i++) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angleStep * i);

                ctx.beginPath();
                ctx.moveTo(x1 - cx, y1 - cy);
                ctx.lineTo(x2 - cx, y2 - cy);
                ctx.stroke();

                ctx.scale(1, -1);
                ctx.beginPath();
                ctx.moveTo(x1 - cx, y1 - cy);
                ctx.lineTo(x2 - cx, y2 - cy);
                ctx.stroke();

                ctx.restore();
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return {
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top
            };
        }

        function handleStart(e) {
            e.preventDefault();
            initAudio();
            startPleasantAmbient();

            if (!firstTouch) {
                firstTouch = true;
                if (introOverlay) introOverlay.style.opacity = '0';
            }

            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            playSparkleSound(pos.y);
        }

        function handleMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            drawSymmetry(lastX, lastY, pos.x, pos.y);
            playSparkleSound(pos.y);
            lastX = pos.x;
            lastY = pos.y;
        }

        function handleEnd() { isDrawing = false; }

        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd);
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        // Header controls setup
        const btnClear = document.getElementById('btn-clear');
        if (btnClear) {
            btnClear.addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
        }

        const btnSound = document.getElementById('btn-sound');
        if (btnSound) {
            btnSound.addEventListener('click', (e) => {
                audioEnabled = !audioEnabled;
                e.target.textContent = audioEnabled ? '🪔 संगीत: सुरु' : '🔇 संगीत: बंद';
                e.target.classList.toggle('active', audioEnabled);
            });
        }

        const btnSymm = document.getElementById('btn-symm');
        if (btnSymm) {
            btnSymm.addEventListener('click', (e) => {
                axesIdx = (axesIdx + 1) % axesList.length;
                axes = axesList[axesIdx];
                e.target.textContent = `${axes} अक्ष (Axes)`;
            });
        }

        const btnColor = document.getElementById('btn-color');
        if (btnColor) {
            btnColor.addEventListener('click', (e) => {
                colorIdx = (colorIdx + 1) % colorModes.length;
                const names = {'vivid': 'रंगबिरंगी (Neon)', 'gold': 'दीप (Gold)', 'flame': 'ज्वाला (Flame)', 'magenta': 'गुलाबी (Magenta)'};
                e.target.textContent = `रंग: ${names[colorModes[colorIdx]]}`;
            });
        }

        requestAnimationFrame(drawBackground);
        requestAnimationFrame(animateFX);
    </script>
</body>
</html>
