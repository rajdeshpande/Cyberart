<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>शुभ दिवाळी — Rajkumar Deshpande</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030108;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #app-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            border: 5px solid #ffb703;
            animation: borderGlow 2.5s infinite alternate;
        }
        @keyframes borderGlow {
            0% { border-color: #ff0055; box-shadow: inset 0 0 20px #ff0055, 0 0 15px #ff0055; }
            33% { border-color: #00f2fe; box-shadow: inset 0 0 20px #00f2fe, 0 0 15px #00f2fe; }
            66% { border-color: #ffe600; box-shadow: inset 0 0 20px #ffe600, 0 0 15px #ffe600; }
            100% { border-color: #39ff14; box-shadow: inset 0 0 20px #39ff14, 0 0 15px #39ff14; }
        }
        header {
            background: linear-gradient(180deg, rgba(30, 5, 45, 0.95) 0%, rgba(10, 2, 20, 0.95) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 6px;
            border-bottom: 2px solid #ffe600;
            z-index: 10;
            flex-shrink: 0;
        }
        .diwali-title {
            font-size: 1.05rem;
            font-weight: 900;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 5px #fff, 0 0 10px #ffe600, 0 0 20px #ff5e00, 0 0 30px #ff0055;
            animation: neonPulse 1.5s infinite alternate;
        }
        @keyframes neonPulse {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px #ffe600, 0 0 20px #ff5e00, 0 0 30px #ff0055; }
            100% { text-shadow: 0 0 10px #fff, 0 0 20px #00f2fe, 0 0 30px #39ff14, 0 0 40px #ff0055; }
        }
        .marathi-sub {
            font-size: 0.75rem;
            color: #ffe600;
            font-weight: 700;
            margin-top: 2px;
            text-shadow: 0 0 6px rgba(255, 230, 0, 0.8);
        }
        .toolbar {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 6px;
            background: rgba(10, 1, 20, 0.9);
            border-bottom: 1px solid rgba(255, 230, 0, 0.3);
            z-index: 10;
            flex-shrink: 0;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid #ffe600;
            color: #fff;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 230, 0, 0.4);
        }
        .btn.active {
            background: linear-gradient(135deg, #ff5e00 0%, #ff0055 100%);
            border-color: #ffe600;
            box-shadow: 0 0 10px #ff0055;
        }
        #canvas-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            background: #030108;
            touch-action: none;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
            touch-action: none;
        }
        #bg-canvas { z-index: 1; pointer-events: none; }
        #paintCanvas { z-index: 2; }
        #fx-canvas { z-index: 3; pointer-events: none; }

        .cracker-bar {
            background: linear-gradient(0deg, rgba(20, 2, 35, 0.95) 0%, rgba(5, 0, 15, 0.95) 100%);
            display: flex;
            justify-content: space-around;
            padding: 6px 4px;
            border-top: 2px solid #ffe600;
            z-index: 10;
            flex-shrink: 0;
        }
        .cracker-btn {
            background: linear-gradient(135deg, #3d0860 0%, #1a022b 100%);
            border: 1.5px solid #ffb703;
            color: #ffe600;
            padding: 6px 2px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
            margin: 0 2px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 183, 3, 0.3);
        }
        .cracker-btn:active {
            transform: scale(0.92);
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 12px #ff0055;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <header>
            <div class="diwali-title">✨ Happy Diwali from Rajkumar Deshpande ✨</div>
            <div class="marathi-sub">शुभ दीपावली! सुंदर रांगोळी काढा व फटाके उडवा 🪔</div>
        </header>

        <div class="toolbar">
            <button class="btn active" id="btn-sound">🪔 संगीत: सुरु</button>
            <button class="btn" id="btn-clear">
