<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cybert — Symmetrical Art Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0f12;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #app-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
        }
        header {
            height: 56px;
            background: rgba(18, 22, 28, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            flex-shrink: 0;
        }
        .brand-container {
            display: flex;
            flex-direction: column;
        }
        .app-title {
            font-size: 1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .attribution {
            font-size: 0.65rem;
            color: #8a99ad;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }
        .icon-btn.primary {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
        }
        #canvas-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            background: #050608;
            touch-action: none;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
            touch-action: none;
        }
        #drawer {
            position: absolute;
            top: 56px;
            right: -280px;
            width: 280px;
            height: calc(100% - 56px);
            background: rgba(18, 22, 28, 0.98);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.3s ease;
            z-index: 20;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }
        #drawer.open { right: 0; }
        #drawer-toggle {
            position: absolute;
            top: 50%;
            left: -36px;
            transform: translateY(-50%);
            width: 36px;
            height: 48px;
            background: rgba(18, 22, 28, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-label {
            font-size: 0.75rem;
            color: #8a99ad;
            text-transform: uppercase;
            font-weight: 600;
        }
        .option-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .grid-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
        }
        .grid-btn.active {
            background: #0072ff;
            border-color: #00c6ff;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <header>
            <div class="brand-container">
                <span class="app-title">Cybert (CYBERART)</span>
                <span class="attribution">by Rajkumar Deshpande</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn primary" id="btn-new">Clear</button>
                <button class="icon-btn" id="btn-audio">🔊 Sound</button>
            </div>
        </header>

        <div id="canvas-wrapper">
            <canvas id="paintCanvas"></canvas>
            
            <div id="drawer">
                <div id="drawer-toggle">⚙️</div>
                <div class="control-group">
                    <label class="control-label">Symmetry Axes</label>
                    <div class="option-grid" id="symmetry-grid">
                        <button class="grid-btn" data-axes="4">4</button>
                        <button class="grid-btn" data-axes="8">8</button>
                        <button class="grid-btn active" data-axes="12">12</button>
                        <button class="grid-btn" data-axes="16">16</button>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">Color Mode</label>
                    <div class="option-grid" id="color-grid">
                        <button class="grid-btn active" data-color="rainbow">Rainbow</button>
                        <button class="grid-btn" data-color="white">White</button>
                        <button class="grid-btn" data-color="gold">Gold</button>
                        <button class="grid-btn" data-color="cyan">Cyan</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        const drawer = document.getElementById('drawer');
        const drawerToggle = document.getElementById('drawer-toggle');

        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let axes = 12;
        let hue = 0;
        let colorMode = 'rainbow';
        let audioEnabled = true;

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(y) {
            if (!audioEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const freq = 150 + ((canvas.height - y) / canvas.height) * 600;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.type = 'triangle';
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }

        function resize() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
        }
        window.addEventListener('resize', resize);
        setTimeout(resize, 100);

        function getColor() {
            if (colorMode === 'white') return '#ffffff';
            if (colorMode === 'gold') return '#ffd700';
            if (colorMode === 'cyan') return '#00f2fe';
            return `hsl(${hue}, 100%, 50%)`;
        }

        function drawSymmetry(x1, y1, x2, y2) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const angleStep = (Math.PI * 2) / axes;

            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = getColor();

            for (let i = 0; i < axes; i++) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angleStep * i);

                ctx.beginPath();
                ctx.moveTo(x1 - cx, y1 - cy);
                ctx.lineTo(x2 - cx, y2 - cy);
                ctx.stroke();

                ctx.scale(1, -1);
                ctx.beginPath();
                ctx.moveTo(x1 - cx, y1 - cy);
                ctx.lineTo(x2 - cx, y2 - cy);
                ctx.stroke();

                ctx.restore();
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return {
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top
            };
        }

        function handleStart(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            playSound(pos.y);
        }

        function handleMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            drawSymmetry(lastX, lastY, pos.x, pos.y);
            hue = (hue + 3) % 360;
            playSound(pos.y);
            lastX = pos.x;
            lastY = pos.y;
        }

        function handleEnd(e) {
            isDrawing = false;
        }

        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd);

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        drawerToggle.addEventListener('click', () => drawer.classList.toggle('open'));

        document.getElementById('btn-new').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        document.getElementById('btn-audio').addEventListener('click', (e) => {
            audioEnabled = !audioEnabled;
            e.target.textContent = audioEnabled ? '🔊 Sound' : '🔇 Mute';
        });

        document.querySelectorAll('#symmetry-grid .grid-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#symmetry-grid .grid-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                axes = parseInt(e.target.dataset.axes);
            });
        });

        document.querySelectorAll('#color-grid .grid-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#color-grid .grid-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                colorMode = e.target.dataset.color;
            });
        });
    </script>
</body>
</html>
