<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cybert — Symmetrical Art Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0f12;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        header {
            height: 56px;
            background: rgba(18, 22, 28, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        .brand-container {
            display: flex;
            flex-direction: column;
        }
        .title-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .app-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-sub {
            font-size: 0.65rem;
            color: #8a99ad;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .attribution {
            font-size: 0.7rem;
            color: #6b7c93;
            font-weight: 400;
            white-space: nowrap;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }
        .icon-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.18);
        }
        .icon-btn.primary {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
        }
        #canvas-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100% - 56px);
            background: #050608;
            cursor: crosshair;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #drawer {
            position: absolute;
            top: 56px;
            right: -300px;
            width: 300px;
            height: calc(100% - 56px);
            background: rgba(18, 22, 28, 0.95);
            backdrop-filter: blur(15px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 20;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
            gap: 20px;
        }
        #drawer.open {
            right: 0;
        }
        #drawer-toggle {
            position: absolute;
            top: 50%;
            left: -36px;
            transform: translateY(-50%);
            width: 36px;
            height: 56px;
            background: rgba(18, 22, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .control-label {
            font-size: 0.8rem;
            color: #8a99ad;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .option-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .grid-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
        }
        .grid-btn.active {
            background: #0072ff;
            border-color: #00c6ff;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #0072ff;
        }
        .action-btn-large {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            color: #000;
            font-weight: 700;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
        }
        #tour-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .tour-card {
            background: #181d24;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            max-width: 340px;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .tour-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #00f2fe;
        }
        .tour-body {
            font-size: 0.85rem;
            color: #b0bec5;
            line-height: 1.4;
        }
        .tour-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <header>
            <div class="brand-container">
                <div class="title-row">
                    <span class="app-title">Cybert</span>
                    <span class="app-sub">CYBERART</span>
                </div>
                <div class="attribution">by Rajkumar Deshpande</div>
            </div>
            <div class="header-actions">
                <button class="icon-btn primary" id="btn-new">New Design</button>
                <button class="icon-btn" id="btn-undo">Undo</button>
                <button class="icon-btn" id="btn-redo">Redo</button>
                <button class="icon-btn" id="btn-audio">🔊 Sound</button>
                <button class="icon-btn" id="btn-help">?</button>
            </div>
        </header>

        <div id="canvas-wrapper">
            <canvas id="paintCanvas"></canvas>
            
            <div id="drawer">
                <div id="drawer-toggle">⚙️</div>
                
                <div class="control-group">
                    <label class="control-label">Brush Size (2px)</label>
                    <input type="range" id="brush-size" min="1" max="50" value="2">
                </div>

                <div class="control-group">
                    <label class="control-label">Audio Synth Sound</label>
                    <div class="option-grid">
                        <button class="grid-btn active" data-sound="jazz">Jazz</button>
                        <button class="grid-btn" data-sound="ambient">Soft</button>
                        <button class="grid-btn" data-sound="synth">Synth</button>
                        <button class="grid-btn" data-sound="off">Off</button>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">Symmetry Axes</label>
                    <div class="option-grid" id="symmetry-grid">
                        <button class="grid-btn" data-axes="2">2</button>
                        <button class="grid-btn" data-axes="4">4</button>
                        <button class="grid-btn" data-axes="8">8</button>
                        <button class="grid-btn active" data-axes="12">12</button>
                        <button class="grid-btn" data-axes="16">16</button>
                        <button class="grid-btn" data-axes="24">24</button>
                        <button class="grid-btn" data-axes="32">32</button>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">Color Mode</label>
                    <div class="option-grid">
                        <button class="grid-btn active" id="btn-rainbow">Rainbow</button>
                        <button class="grid-btn" id="btn-white">White</button>
                        <button class="grid-btn" id="btn-gold">Gold</button>
                        <button class="grid-btn" id="btn-cyan">Cyan</button>
                    </div>
                </div>

                <button class="action-btn-large" id="btn-share">Share App (WhatsApp)</button>
                <button class="icon-btn" id="btn-download" style="justify-content:center; padding:10px;">Download Image</button>
            </div>
        </div>
    </div>

    <div id="tour-overlay">
        <div class="tour-card">
            <div class="tour-title" id="tour-step-title">Welcome to Cybert</div>
            <div class="tour-body" id="tour-step-body">Draw multi-axis symmetrical neon artwork with interactive audio feedback.</div>
            <div class="tour-actions">
                <button class="icon-btn" id="tour-skip">Skip</button>
                <button class="icon-btn primary" id="tour-next">Next</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const drawer = document.getElementById('drawer');
        const drawerToggle = document.getElementById('drawer-toggle');

        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let brushSize = 2;
        let axes = 12;
        let hue = 0;
        let colorMode = 'rainbow';
        let audioEnabled = true;
        let soundType = 'jazz';

        let undoStack = [];
        let redoStack = [];

        // Audio API Setup
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(x, y) {
            if (!audioEnabled) return;
            initAudio();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            const freq = 150 + ((canvas.height - y) / canvas.height) * 600;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            if (soundType === 'jazz') {
                osc.type = 'triangle';
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            } else if (soundType === 'ambient') {
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            } else if (soundType === 'synth') {
                osc.type = 'sawtooth';
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            const temp = ctx.getImageData(0, 0, canvas.width, canvas.height);
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            ctx.putImageData(temp, 0, 0);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function saveState() {
            if (undoStack.length > 20) undoStack.shift();
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            redoStack = [];
        }

        function getColor() {
            if (colorMode === 'white') return '#ffffff';
            if (colorMode === 'gold') return '#ffd700';
            if (colorMode === 'cyan') return '#00f2fe';
            return `hsl(${hue}, 100%, 50%)`;
        }

        function drawSymmetry(x1, y1, x2, y2) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const angleStep = (Math.PI * 2) / axes;

            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.strokeStyle = getColor();

            for (let i = 0; i < axes; i++) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angleStep * i);

                ctx.beginPath();
                ctx.moveTo(x1 - cx, y1 - cy);
                ctx.lineTo(x2 - cx, y2 - cy);
                ctx.stroke();

                ctx.scale(1, -1);
                ctx.beginPath();
                ctx.moveTo(x1 - cx, y1 - cy);
                ctx.lineTo(x2 - cx, y2 - cy);
                ctx.stroke();

                ctx.restore();
            }
        }

        function startDraw(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            lastY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            saveState();
            playSound(lastX, lastY);
        }

        function moveDraw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

            drawSymmetry(lastX, lastY, x, y);
            hue = (hue + 2) % 360;

            if (Math.abs(x - lastX) > 5 || Math.abs(y - lastY) > 5) {
                playSound(x, y);
            }

            lastX = x;
            lastY = y;
        }

        function stopDraw() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        window.addEventListener('mouseup', stopDraw);

        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', moveDraw);
        window.addEventListener('touchend', stopDraw);

        drawerToggle.addEventListener('click', () => drawer.classList.toggle('open'));

        document.getElementById('btn-new').addEventListener('click', () => {
            saveState();
            ctx.clearRect(0
