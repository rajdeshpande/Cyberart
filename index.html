<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>शुभ दिवाळी — Rajkumar Deshpande</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08030f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #app-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            border: 4px solid #ffb703;
            box-shadow: inset 0 0 20px #ff0055, 0 0 15px #ffb703;
        }
        header {
            background: linear-gradient(180deg, rgba(35, 5, 50, 0.95) 0%, rgba(15, 3, 25, 0.9) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 10px;
            border-bottom: 2px solid #ffb703;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3);
            z-index: 10;
        }
        .diwali-title {
            font-size: 1.1rem;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(45deg, #ffe600, #ff5e00, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.5);
        }
        .marathi-sub {
            font-size: 0.8rem;
            color: #ffd700;
            font-weight: 600;
            margin-top: 2px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            padding: 6px;
            background: rgba(20, 5, 30, 0.8);
            border-bottom: 1px solid rgba(255, 183, 3, 0.3);
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffb703;
            color: #fff;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(255, 183, 3, 0.2);
        }
        .btn.active {
            background: linear-gradient(135deg, #ff5e00 0%, #ff0055 100%);
            border-color: #ffe600;
        }
        #canvas-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            background: radial-gradient(circle at center, #150024 0%, #05000a 100%);
            touch-action: none;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
            touch-action: none;
            z-index: 2;
        }
        #bg-canvas {
            z-index: 1;
            pointer-events: none;
        }
        .kandil {
            position: absolute;
            width: 30px;
            height: 45px;
            z-index: 3;
            pointer-events: none;
            filter: drop-shadow(0 0 8px #ffb703);
        }
        .kandil-left { top: 10px; left: 10px; }
        .kandil-right { top: 10px; right: 10px; }
    </style>
</head>
<body>
    <div id="app-container">
        <header>
            <div class="diwali-title">✨ Happy Diwali from Rajkumar Deshpande ✨</div>
            <div class="marathi-sub">शुभ दीपावली! रंगीबेरंगी रांगोळी व नाद निर्माण करा 🪔</div>
        </header>

        <div class="toolbar">
            <button class="btn active" id="btn-sound">🪔 संगीत: सुरु</button>
            <button class="btn" id="btn-clear">🧹 साफ करा</button>
            <button class="btn" id="btn-symm">12 अक्ष (Axes)</button>
            <button class="btn" id="btn-color">रंग: दीप (Gold)</button>
        </div>

        <div id="canvas-wrapper">
            <!-- Decorative Festive Lanterns -->
            <svg class="kandil kandil-left" viewBox="0 0 100 150">
                <polygon points="50,10 90,50 50,90 10,50" fill="#ff5e00" stroke="#ffe600" stroke-width="4"/>
                <line x1="50" y1="90" x2="30" y2="140" stroke="#ff0055" stroke-width="4"/>
                <line x1="50" y1="90" x2="50" y2="145" stroke="#ffe600" stroke-width="4"/>
                <line x1="50" y1="90" x2="70" y2="140" stroke="#ff0055" stroke-width="4"/>
            </svg>
            <svg class="kandil kandil-right" viewBox="0 0 100 150">
                <polygon points="50,10 90,50 50,90 10,50" fill="#ff0055" stroke="#ffe600" stroke-width="4"/>
                <line x1="50" y1="90" x2="30" y2="140" stroke="#ff5e00" stroke-width="4"/>
                <line x1="50" y1="90" x2="50" y2="145" stroke="#ffe600" stroke-width="4"/>
                <line x1="50" y1="90" x2="70" y2="140" stroke="#ff5e00" stroke-width="4"/>
            </svg>

            <canvas id="bg-canvas"></canvas>
            <canvas id="paintCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');

        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let axesList = [8, 12, 16, 24, 6];
        let axesIdx = 1;
        let axes = axesList[axesIdx];
        
        let colorModes = ['gold', 'flame', 'rainbow', 'neon'];
        let colorIdx = 0;
        let hue = 0;

        let audioEnabled = true;
        let audioCtx = null;
        let ambientOsc = null;

        // Background Sparkles & Stars
        let stars = [];
        function initStars() {
            stars = [];
            for(let i = 0; i < 50; i++) {
                stars.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    size: Math.random() * 2 + 1,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }

        function drawBackground() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            for(let s of stars) {
                s.alpha += s.speed;
                if(s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                bgCtx.fillStyle = `rgba(255, 230, 150, ${Math.abs(s.alpha)})`;
                bgCtx.beginPath();
                bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                bgCtx.fill();
            }
            requestAnimationFrame(drawBackground);
        }

        // Web Audio - Festive Harmonies
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSparkleSound(y) {
            if (!audioEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // Traditional Indian Scale Frequencies (approx Shivaranjani / Festive Raga)
                const scale = [261.63, 293.66, 311.13, 392.00, 440.00, 523.25, 587.33];
                const noteIdx = Math.floor(((bgCanvas.height - y) / bgCanvas.height) * scale.length);
                const freq = scale[Math.min(Math.max(noteIdx, 0), scale.length - 1)];

                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.type = 'sine';
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        function resize() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            bgCanvas.width = wrapper.clientWidth;
            bgCanvas.height = wrapper.clientHeight;
            initStars();
        }
        window.addEventListener('resize', resize);
        setTimeout(resize, 100);

        function getColor() {
            const mode = colorModes[colorIdx];
            if (mode === 'gold') return `hsl(45, 100%, ${50 + Math.random() * 20}%)`;
            if (mode === 'flame') return `hsl(${10 + Math.random() * 30}, 100%, 50%)`;
            if (mode === 'neon') return `hsl(300, 100%, 60%)`;
            return `hsl(${hue}, 100%, 50%)`;
        }

        function drawSymmetry(x1, y1, x2, y2) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const angleStep = (Math.PI * 2) / axes;

            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = getColor();
            ctx.shadowBlur = 8;
            ctx.shadowColor = ctx.strokeStyle;

            for (let i = 0; i < axes; i++) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angleStep * i);

                ctx.beginPath();
                ctx.moveTo(x1 - cx, y1 - cy);
                ctx.lineTo(x2 - cx, y2 - cy);
                ctx.stroke();

                ctx.scale(1, -1);
                ctx.beginPath();
                ctx.moveTo(x1 - cx, y1 - cy);
                ctx.lineTo(x2 - cx, y2 - cy);
                ctx.stroke();

                ctx.restore();
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return {
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top
            };
        }

        function handleStart(e) {
            e.preventDefault();
            initAudio();
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            playSparkleSound(pos.y);
        }

        function handleMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            drawSymmetry(lastX, lastY, pos.x, pos.y);
            hue = (hue + 4) % 360;
            playSparkleSound(pos.y);
            lastX = pos.x;
            lastY = pos.y;
        }

        function handleEnd() { isDrawing = false; }

        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd);
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        // Buttons
        document.getElementById('btn-clear').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        document.getElementById('btn-sound').addEventListener('click', (e) => {
            audioEnabled = !audioEnabled;
            e.target.textContent = audioEnabled ? '🪔 संगीत: सुरु' : '🔇 संगीत: बंद';
            e.target.classList.toggle('active', audioEnabled);
        });

        document.getElementById('btn-symm').addEventListener('click', (e) => {
            axesIdx = (axesIdx + 1) % axesList.length;
            axes = axesList[axesIdx];
            e.target.textContent = `${axes} अक्ष (Axes)`;
        });

        document.getElementById('btn-color').addEventListener('click', (e) => {
            colorIdx = (colorIdx + 1) % colorModes.length;
            const names = {'gold': 'दीप (Gold)', 'flame': 'ज्वाला (Flame)', 'rainbow': 'रंगबिरंगी (Rainbow)', 'neon': 'गुलाबी (Neon)'};
            e.target.textContent = `रंग: ${names[colorModes[colorIdx]]}`;
        });

        requestAnimationFrame(drawBackground);
    </script>
</body>
</html>
