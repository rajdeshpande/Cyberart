<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>शुभ दिवाळी — Rajkumar Deshpande</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d021a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #app-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            border: 6px solid #ffb703;
            animation: borderGlow 2.5s infinite alternate;
        }
        @keyframes borderGlow {
            0% { border-color: #ff0055; box-shadow: inset 0 0 25px #ff0055, 0 0 20px #ff0055; }
            33% { border-color: #00f2fe; box-shadow: inset 0 0 25px #00f2fe, 0 0 20px #00f2fe; }
            66% { border-color: #ffe600; box-shadow: inset 0 0 25px #ffe600, 0 0 20px #ffe600; }
            100% { border-color: #39ff14; box-shadow: inset 0 0 25px #39ff14, 0 0 20px #39ff14; }
        }
        header {
            background: linear-gradient(180deg, rgba(35, 5, 50, 0.95) 0%, rgba(15, 2, 25, 0.95) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 6px;
            border-bottom: 2px solid #ffe600;
            z-index: 10;
            flex-shrink: 0;
        }
        .diwali-title {
            font-size: 1.1rem;
            font-weight: 900;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 5px #fff, 0 0 10px #ffe600, 0 0 20px #ff5e00, 0 0 30px #ff0055;
            animation: neonPulse 1.5s infinite alternate;
        }
        @keyframes neonPulse {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px #ffe600, 0 0 20px #ff5e00, 0 0 30px #ff0055; }
            100% { text-shadow: 0 0 10px #fff, 0 0 20px #00f2fe, 0 0 30px #39ff14, 0 0 40px #ff0055; }
        }
        .marathi-sub {
            font-size: 0.78rem;
            color: #ffe600;
            font-weight: 700;
            margin-top: 2px;
            text-shadow: 0 0 6px rgba(255, 230, 0, 0.8);
        }
        .toolbar {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 6px;
            background: rgba(15, 2, 25, 0.9);
            border-bottom: 1px solid rgba(255, 230, 0, 0.3);
            z-index: 10;
            flex-shrink: 0;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid #ffe600;
            color: #fff;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 230, 0, 0.4);
        }
        .btn.active {
            background: linear-gradient(135deg, #ff5e00 0%, #ff0055 100%);
            border-color: #ffe600;
            box-shadow: 0 0 10px #ff0055;
        }
        #canvas-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            background: radial-gradient(circle at center, #260540 0%, #0d021a 100%);
            touch-action: none;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
            touch-action: none;
        }
        #bg-canvas { z-index: 1; pointer-events: none; }
        #paintCanvas { z-index: 2; }
        #fx-canvas { z-index: 3; pointer-events: none; }

        .cracker-bar {
            background: linear-gradient(0deg, rgba(25, 3, 40, 0.95) 0%, rgba(10, 2, 20, 0.95) 100%);
            display: flex;
            justify-content: space-around;
            padding: 6px 4px;
            border-top: 2px solid #ffe600;
            z-index: 10;
            flex-shrink: 0;
        }
        .cracker-btn {
            background: linear-gradient(135deg, #4a0b75 0%, #1e0333 100%);
            border: 1.5px solid #ffb703;
            color: #ffe600;
            padding: 6px 2px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
            margin: 0 2px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 183, 3, 0.3);
        }
        .cracker-btn:active {
            transform: scale(0.92);
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 12px #ff0055;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <header>
            <div class="diwali-title">✨ Happy Diwali from Rajkumar Deshpande ✨</div>
            <div class="marathi-sub">शुभ दीपावली! सुंदर रांगोळी काढा व फटाके उडवा 🪔</div>
        </header>

        <div class="toolbar">
            <button class="btn active" id="btn-sound">🪔 संगीत: सुरु</button>
            <button class="btn" id="btn-clear">🧹 साफ करा</button>
            <button class="btn" id="btn-symm">12 अक्ष (Axes)</button>
            <button class="btn" id="btn-color">रंग: रंगबिरंगी (Rainbow)</button>
        </div>

        <div id="canvas-wrapper">
            <canvas id="bg-canvas"></canvas>
            <canvas id="paintCanvas"></canvas>
            <canvas id="fx-canvas"></canvas>
        </div>

        <div class="cracker-bar">
            <button class="cracker-btn" onclick="triggerCracker('sparkler')">✨<span>फुलबाजा</span></button>
            <button class="cracker-btn" onclick="triggerCracker('chakra')">🌀<span>भुईचक्र</span></button>
            <button class="cracker-btn" onclick="triggerCracker('anar')">🎆<span>अनार</span></button>
            <button class="cracker-btn" onclick="triggerCracker('laxmi')">💥<span>लक्ष्मी फटाका</span></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const fxCanvas = document.getElementById('fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');

        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let axesList = [8, 12, 16, 24, 6];
        let axesIdx = 1;
        let axes = axesList[axesIdx];
        
        let colorModes = ['rainbow', 'gold', 'flame', 'neon'];
        let colorIdx = 0;
        let hue = 0;

        let audioEnabled = true;
        let audioCtx = null;

        // Background Multi-Colored Stars
        let stars = [];
        const neonColors = ['#ffe600', '#ff0055', '#00f2fe', '#39ff14', '#ff5e00', '#ffffff'];
        
        function initStars() {
            stars = [];
            const w = bgCanvas.width || window.innerWidth;
            const h = bgCanvas.height || window.innerHeight;
            for(let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 2.5 + 1,
                    color: neonColors[Math.floor(Math.random() * neonColors.length)],
                    alpha: Math.random(),
                    speed: Math.random() * 0.04 + 0.01
                });
            }
        }

        // Draw Akash Kandil (आकाश कंदील)
        function drawKandil(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Hanging String
            ctx.strokeStyle = '#ffe600';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(0, -30); ctx.stroke();

            // Diamond Body
            ctx.fillStyle = '#ff0055';
            ctx.strokeStyle = '#ffe600';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(25, 0);
            ctx.lineTo(0, 30);
            ctx.lineTo(-25, 0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Inner Glow Diamond
            ctx.fillStyle = '#ffe600';
            ctx.beginPath();
            ctx.moveTo(0, -15); ctx.lineTo(12, 0); ctx.lineTo(0, 15); ctx.lineTo(-12, 0);
            ctx.closePath(); ctx.fill();

            // Hanging Tassels
            const colors = ['#ff5e00', '#ffe600', '#ff0055'];
            for(let i = -2; i <= 2; i++) {
                ctx.strokeStyle = colors[Math.abs(i) % colors.length];
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(i * 10, 30);
                ctx.lineTo(i * 12, 70);
                ctx.stroke();
            }
            ctx.restore();
        }

        // Draw Traditional Diya (पणती)
        function drawDiya(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Base Bowl
            ctx.fillStyle = '#d4af37';
            ctx.strokeStyle = '#ff5e00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 30, 0, Math.PI, false);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Flame Glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff5e00';

            // Outer Flame
            ctx.fillStyle = '#ff5e00';
            ctx.beginPath();
            ctx.moveTo(-10, -5);
            ctx.quadraticCurveTo(0, -35, 0, -45);
            ctx.quadraticCurveTo(0, -35, 10, -5);
            ctx.closePath(); ctx.fill();

            // Inner Flame
            ctx.fillStyle = '#ffe600';
            ctx.beginPath();
            ctx.moveTo(-5, -5);
            ctx.quadraticCurveTo(0, -25, 0, -32);
            ctx.quadraticCurveTo(0, -25, 5, -5);
            ctx.closePath(); ctx.fill();

            ctx.restore();
        }

        function drawBackground() {
            const w = bgCanvas.width;
            const h = bgCanvas.height;
            bgCtx.clearRect(0, 0, w, h);

            // 1. Render Stars
            for(let s of stars) {
                s.alpha += s.speed;
                if(s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                bgCtx.fillStyle = s.color;
                bgCtx.globalAlpha = Math.abs(s.alpha);
                bgCtx.shadowBlur = 6;
                bgCtx.shadowColor = s.color;
                bgCtx.beginPath();
                bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                bgCtx.fill();
            }
            bgCtx.globalAlpha = 1.0;
            bgCtx.shadowBlur = 0;

            // 2. Render Akash Kandil at top corners
            drawKandil(bgCtx, 45, 50, 0.7);
            drawKandil(bgCtx, w - 45, 50, 0.7);

            // 3. Render Diyas at the bottom
            drawDiya(bgCtx, w * 0.25, h - 35, 0.65);
            drawDiya(bgCtx, w * 0.50, h - 40, 0.85);
            drawDiya(bgCtx, w * 0.75, h - 35, 0.65);

            requestAnimationFrame(drawBackground);
        }

        // Web Audio Synthesizer
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type='sine', duration=0.25, vol=0.15) {
            if (!audioEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playSparkleSound(y) {
            const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
            const noteIdx = Math.floor(((bgCanvas.height - y) / bgCanvas.height) * scale.length);
            const freq = scale[Math.min(Math.max(noteIdx, 0), scale.length - 1)];
            playTone(freq, 'triangle', 0.25, 0.12);
        }

        // Cracker FX Engine
        let fxParticles = [];
        function animateFX() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for(let i = fxParticles.length - 1; i >= 0; i--) {
                let p = fxParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity || 0.05;
                p.alpha -= p.decay;
                if(p.alpha <= 0) {
                    fxParticles.splice(i, 1);
                    continue;
                }
                fxCtx.fillStyle = p.color;
                fxCtx.globalAlpha = p.alpha;
                fxCtx.shadowBlur = 8;
                fxCtx.shadowColor = p.color;
                fxCtx.beginPath();
                fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                fxCtx.fill();
            }
            fxCtx.globalAlpha = 1.0;
            fxCtx.shadowBlur = 0;
            requestAnimationFrame(animateFX);
        }

        function triggerCracker(type) {
            initAudio();
            const cx = fxCanvas.width / 2;
            const cy = fxCanvas.height / 2;

            if (type === 'sparkler') {
                for(let i = 0; i < 100; i++) {
                    let angle = Math.random() * Math.PI * 2;
                    let speed = Math.random() * 6 + 1;
                    fxParticles.push({
                        x: cx, y: cy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 3.5 + 2,
                        color: neonColors[Math.floor(Math.random() * neonColors.length)],
                        alpha: 1, decay: 0.018, gravity: 0.04
                    });
                }
                for(let t=0; t<6; t++) setTimeout(() => playTone(800 + Math.random()*800, 'sawtooth', 0.08, 0.08), t*40);

            } else if (type === 'chakra') {
                for(let i = 0; i < 140; i++) {
                    let angle = (i / 140) * Math.PI * 12;
                    let speed = (i / 140) * 7 + 1.5;
                    fxParticles.push({
                        x: cx, y: cy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 4 + 2,
                        color: `hsl(${(i * 12) % 360}, 100%, 65%)`,
                        alpha: 1, decay: 0.012, gravity: 0
                    });
                }
                for(let t=0; t<10; t++) setTimeout(() => playTone(250 + t*120, 'sine', 0.12, 0.12), t*35);

            } else if (type === 'anar') {
                for(let i = 0; i < 160; i++) {
                    let angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.9;
                    let speed = Math.random() * 11 + 4;
                    fxParticles.push({
                        x: cx, y: fxCanvas.height - 10,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 4.5 + 2,
                        color: Math.random() > 0.4 ? '#ff5e00' : '#ffe600',
                        alpha: 1, decay: 0.014, gravity: 0.18
                    });
                }
                for(let t=0; t<8; t++) setTimeout(() => playTone(350 + Math.random()*600, 'square', 0.1, 0.08), t*50);

            } else if (type === 'laxmi') {
                for(let i = 0; i < 250; i++) {
                    let angle = Math.random() * Math.PI * 2;
                    let speed = Math.random() * 14 + 2;
                    fxParticles.push({
                        x: cx, y: cy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 5 + 2.5,
                        color: Math.random() > 0.2 ? '#ff0055' : '#ffe600',
                        alpha: 1, decay: 0.015, gravity: 0.06
                    });
                }
                playTone(85, 'sawtooth', 0.6, 0.5);
                setTimeout(() => playTone(50, 'sine', 0.8, 0.6), 50);
            }
        }

        function resize() {
            const width = wrapper.clientWidth || window.innerWidth;
            const height = wrapper.clientHeight || (window.innerHeight - 150);
            canvas.width = width;
            canvas.height = height;
            bgCanvas.width = width;
            bgCanvas.height = height;
            fxCanvas.width = width;
            fxCanvas.height = height;
            initStars();
        }

        window.addEventListener('resize', resize);
        setTimeout(resize, 50);

        function getColor() {
            const mode = colorModes[colorIdx];
            if (mode === 'gold') return `hsl(45, 100%, ${50 + Math.random() * 20}%)`;
            if (mode === 'flame') return `hsl(${10 + Math.random() * 30}, 100%, 50%)`;
            if (mode === 'neon') return `hsl(300, 100%, 60%)`;
            return `hsl(${hue}, 100%, 50%)`;
        }

        function drawSymmetry(x1, y1, x2, y2) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const angleStep = (Math.PI * 2) / axes;

            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = getColor();
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.strokeStyle;

            for (let i = 0; i < axes; i++) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angleStep * i);

                ctx.beginPath();
                ctx.moveTo(x1 - cx, y1 - cy);
                ctx.lineTo(x2 - cx, y2 - cy);
                ctx.stroke();

                ctx.scale(1, -1);
                ctx.beginPath();
                ctx.moveTo(x1 - cx, y1 - cy);
                ctx.lineTo(x2 - cx, y2 - cy);
                ctx.stroke();

                ctx.restore();
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return {
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top
            };
        }

        function handleStart(e) {
            e.preventDefault();
            initAudio();
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            playSparkleSound(pos.y);
        }

        function handleMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            drawSymmetry(lastX, lastY, pos.x, pos.y);
            hue = (hue + 4) % 360;
            playSparkleSound(pos.y);
            lastX = pos.x;
            lastY = pos.y;
        }

        function handleEnd() { isDrawing = false; }

        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd);
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        // Header controls setup
        const btnClear = document.getElementById('btn-clear');
        if (btnClear) {
            btnClear.addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
        }

        const btnSound = document.getElementById('btn-sound');
        if (btnSound) {
            btnSound.addEventListener('click', (e) => {
                audioEnabled = !audioEnabled;
                e.target.textContent = audioEnabled ? '🪔 संगीत: सुरु' : '🔇 संगीत: बंद';
                e.target.classList.toggle('active', audioEnabled);
            });
        }

        const btnSymm = document.getElementById('btn-symm');
        if (btnSymm) {
            btnSymm.addEventListener('click', (e) => {
                axesIdx = (axesIdx + 1) % axesList.length;
                axes = axesList[axesIdx];
                e.target.textContent = `${axes} अक्ष (Axes)`;
            });
        }

        const btnColor = document.getElementById('btn-color');
        if (btnColor) {
            btnColor.addEventListener('click', (e) => {
                colorIdx = (colorIdx + 1) % colorModes.length;
                const names = {'rainbow': 'रंगबिरंगी (Rainbow)', 'gold': 'दीप (Gold)', 'flame': 'ज्वाला (Flame)', 'neon': 'गुलाबी (Neon)'};
                e.target.textContent = `रंग: ${names[colorModes[colorIdx]]}`;
            });
        }

        requestAnimationFrame(drawBackground);
        requestAnimationFrame(animateFX);
    </script>
</body>
</html>
