<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>शुभ दिवाळी — Rajkumar Deshpande</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080214;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #app-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            border: 4px solid #ffb703;
            box-shadow: inset 0 0 20px #ff0055, 0 0 15px #ffe600;
        }

        /* LED String Light Border System */
        .led-border {
            position: absolute;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }
        .led-top { top: 0; left: 0; right: 0; height: 10px; flex-direction: row; }
        .led-bottom { bottom: 0; left: 0; right: 0; height: 10px; flex-direction: row; }
        .led-left { top: 0; bottom: 0; left: 0; width: 10px; flex-direction: column; }
        .led-right { top: 0; bottom: 0; right: 0; width: 10px; flex-direction: column; }

        .led-bulb {
            width: 8px; height: 8px;
            border-radius: 50%;
            animation: ledBlink 1.2s infinite alternate;
        }
        @keyframes ledBlink {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.4); }
        }

        header {
            background: linear-gradient(180deg, rgba(35, 5, 50, 0.95) 0%, rgba(15, 2, 25, 0.95) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 4px 4px 4px;
            border-bottom: 1.5px solid #ffe600;
            z-index: 10;
            flex-shrink: 0;
            position: relative;
        }
        .diwali-title {
            font-size: 0.98rem;
            font-weight: 900;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 5px #fff, 0 0 10px #ffe600, 0 0 20px #ff5e00, 0 0 30px #ff0055;
            animation: neonPulse 1.5s infinite alternate;
        }
        @keyframes neonPulse {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px #ffe600, 0 0 20px #ff5e00, 0 0 30px #ff0055; }
            100% { text-shadow: 0 0 10px #fff, 0 0 20px #00f2fe, 0 0 30px #39ff14, 0 0 40px #ff0055; }
        }
        .marathi-sub {
            font-size: 0.72rem;
            color: #ffe600;
            font-weight: 700;
            margin-top: 1px;
            text-shadow: 0 0 6px rgba(255, 230, 0, 0.8);
        }

        /* Visitor Counter Badge */
        .visitor-badge {
            position: absolute;
            top: 4px; right: 8px;
            font-size: 0.6rem;
            font-weight: 800;
            color: #00f2fe;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 6px;
            border-radius: 8px;
            border: 1px solid #00f2fe;
            box-shadow: 0 0 6px #00f2fe;
        }

        /* Compact Toolbar */
        .toolbar {
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 4px;

            border-bottom: 1px solid rgba(255, 230, 0, 0.3);
